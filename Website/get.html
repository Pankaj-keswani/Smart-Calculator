<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get VoiceCalc AI</title>
  <meta name="description" content="Download VoiceCalc AI, the offline voice calculator, from Google Play or the App Store.">
  <meta name="theme-color" content="#0a0c10">
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0a0c10; color: #f4f4f5; padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; text-align: center; padding: 32px 24px;
      background: #12141d; border: 1px solid rgba(255, 229, 0, 0.18); border-radius: 24px;
    }
    .card img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 16px 0 6px; }
    p { color: #a1a1aa; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px 16px; margin-top: 12px; border-radius: 14px;
      font-weight: 700; font-size: 15px; text-decoration: none;
    }
    .btn svg { width: 20px; height: 20px; flex: none; }
    .primary { background: #ffe500; color: #0a0c10; }
    .secondary { background: transparent; color: #f4f4f5; border: 1px solid #3f3f46; }
    .back { display: inline-block; margin-top: 20px; color: #a1a1aa; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/icon.png" alt="VoiceCalc AI icon">
    <h1>VoiceCalc AI</h1>
    <p id="status">Free offline voice calculator. Choose your store:</p>
    <a class="btn primary" id="play" href="https://play.google.com/store/apps/details?id=com.voicecalcai.app" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 1.8 13.3 12 3.6 22.2c-.4-.3-.6-.8-.6-1.4V3.2c0-.6.2-1.1.6-1.4zm11 9.4 2.4-2.5 4.3 2.5c.8.5.8 1.5 0 2l-4.3 2.5-2.4-2.5L14.6 12zM5.2 1.2l9.7 2.1-3.4 3.5L5.2 1.2zm0 21.6 6.3-5.6 3.4 3.5-9.7 2.1z"/></svg>
      Get it on Google Play
    </a>
    <a class="btn secondary" id="ios" href="https://apps.apple.com/app/id6825993059" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.77-3.320-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.82-.81-3-.79-1.54.02-2.96.9-3.76 2.28-1.6 2.78-.41 6.9 1.150 9.16.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.66zM14.1 5.86c.63-.77 1.06-1.83.94-2.89-.91.04-2.01.61-2.66 1.37-.58.67-1.09 1.75-.96 2.79 1.02.08 2.05-.52 2.68-1.27z"/></svg>
      Download on the App Store
    </a>
    <a class="back" href="./">Learn more about VoiceCalc AI</a>
  </main>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var target = isIOS ? document.getElementById('ios') : isAndroid ? document.getElementById('play') : null;
      if (target) {
        document.getElementById('status').textContent = 'Opening the ' + (isIOS ? 'App Store' : 'Play Store') + '…';
        window.location.replace(target.href);
      }
    })();
  </script>
</body>
</html>
